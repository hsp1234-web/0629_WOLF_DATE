data_fetching:
  fred_series_map:
    SOFR: 'SOFR'
    DGS10: 'DGS10'
    DGS2: 'DGS2'
    RRP: 'RRPONTSYD'
    VIX_FRED: 'VIXCLS'
    Reserves: 'WRESBAL'
    DTB3: 'DTB3'
  fred_move_ticker: 'MOVEIX'
  yahoo_tickers_map:
    Volatility_Index: '^MOVE'
    VIX: '^VIX'
    TLT_Close: 'TLT'
  nyfed_data_urls: [
      "https://markets.newyorkfed.org/api/pd/get/SBN2024/timeseries/PDPOSGSC-L2_PDPOSGSC-G2L3_PDPOSGSC-G3L6_PDPOSGSC-G6L7_PDPOSGSC-G7L11_PDPOSGSC-G11L21_PDPOSGSC-G21.xlsx",
      "https://markets.newyorkfed.org/api/pd/get/SBN2022/timeseries/PDPOSGSC-L2_PDPOSGSC-G2L3_PDPOSGSC-G3L6_PDPOSGSC-G6L7_PDPOSGSC-G7L11_PDPOSGSC-G11L21_PDPOSGSC-G21.xlsx",
      "https://markets.newyorkfed.org/api/pd/get/SBN2015/timeseries/PDPOSGSC-L2_PDPOSGSC-G2L3_PDPOSGSC-G3L6_PDPOSGSC-G6L7_PDPOSGSC-G7L11_PDPOSGSC-G11.xlsx",
      "https://markets.newyorkfed.org/api/pd/get/SBN2013/timeseries/PDPOSGSC-L2_PDPOSGSC-G2L3_PDPOSGSC-G3L6_PDPOSGSC-G6L7_PDPOSGSC-G7L11_PDPOSGSC-G11.xlsx",
      "https://markets.newyorkfed.org/api/pd/get/SBP2013/timeseries/PDPUSGCS3LNOP_PDPUSGCS36NOP_PDPUSGCS611NOP_PDPUSGCSM11NOP.xlsx",
      "https://markets.newyorkfed.org/api/pd/get/SBP2001/timeseries/PDPUSGCS5LNOP_PDPUSGCS5MNOP.xlsx"
  ]
  sbp_cols_config: {
    # SBN 數據的加總邏輯在 data_fetcher.py 中是基於欄位名 (PDPOSGSC-) 的，所以這裡 SBN 列表可以為空
    "SBN": [],
    "SBP2013": [
        "PDPUSGCS3LNOP",
        "PDPUSGCS36NOP",
        "PDPUSGCS611NOP",
        "PDPUSGCSM11NOP"
    ],
    "SBP2001": [
        "PDPUSGCS5LNOP",
        "PDPUSGCS5MNOP"
    ]
  }

calculation_params:
  stress_index_weights: # 這些是 calculator.py 中 component_mapping 使用的鍵
    sofr_dev: 0.20
    spread_inv: 0.20
    gross_pos: 0.15     # 對應 Total_Gross_Positions_Millions
    move: 0.20          # 對應 Volatility_Index
    vix: 0.15           # 對應 VIX
    pos_res_ratio: 0.10 # 對應 Pos_Res_Ratio
  macd_fast_period: 12
  macd_slow_period: 26
  macd_signal_period: 9
  rolling_window_days: 252
  smoothing_window_stress_index: 5
  threshold_ratio_color: 90.0
  enable_macd_momentum_plot: true
  weights: # 這個 'weights' 鍵與 stress_index_weights 重複，並且 schemas.py 中 CalculationParamsConfig 也只定義了一個 weights。應統一。
           # 根據 calculator.py，它使用的是 config.get('weights', {})，所以下面的這個 weights 會被使用。
           # 為了清晰，建議將 stress_index_weights 移除或與此處的 weights 統一。暫時保留，但優先使用此處的。
    sofr_dev: 0.35      # 使用您提供的 PROJECT_CONFIG 中的權重
    spread_inv: 0.10
    gross_pos: 0.05
    move: 0.25
    vix: 0.15
    pos_res_ratio: 0.10
  macd_params:
    fast: 12
    slow: 26
    signal: 9
  macd_colors:
    blue: "#6495ED"
    green: "#3CB371"
    red: "#B22222"

report_settings:
  report_title: "交易商每日壓力指數監控報告"

gemini_config:
  model_name: "gemini-1.5-flash"
  temperature: 0.6

visualization_params:
  plots_config:
    SOFR: true
    Spread: true
    MOVE: true
    VIX: true
    DealerPos: true # 打開以查看 NY Fed 數據
    Reserves: true
    StressIndex: true
    Ratio: true
    MACD: true
    ETF: false
  chart_params:
    dashboard_main_name_html: "綜合市場壓力儀表板"
    main_plot_titles:
      SOFR: "SOFR 利率 (%)"
      Spread: "利差 (10年期-2年期, 基點)"
      MOVE: "MOVE 波動率指數"
      VIX: "VIX 波動率指數"
      StressIndex: "交易商壓力指數 (0-100)"
      Ratio: "主要交易商持倉/準備金比率"
      MACD: "壓力指數 MACD 動能"
      DealerPos: "NY Fed 一級交易商持有量 (百萬美元)" # 新增標題
      Reserves: "銀行準備金 (百萬美元)"
  gauge_thresholds:
    high: 80
    medium: 60
    low: 30

# Runner 設定 (stress_report_app 不直接使用，但保留以符合 project_config.yaml 的完整性)
runner_settings:
  max_concurrent_apps: 2
  python_executable: "python"
